<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ideaforge{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
  <header class="top">
    <span class="brand">Ideaforge</span>
    <nav>
      {% for key, label, href in nav %}
      <a href="{{ href }}"{% if key == active %} class="active" aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {% if dev_marker %}
    <div class="banner warn" role="alert" id="dev-marker">
      <strong>The job worker is blocked.</strong> {{ dev_marker }} Queued jobs wait until then.
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
