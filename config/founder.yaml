# Founder constraints applied to every idea (open decision IF-150).
# Confirmed by the user under IF-150. While confirmed is false, /validate treats the values as placeholders.
confirmed: true
hours_per_week: 20
capital_eur: 5000
skills:
  - software engineering (web/backend, 8 years)
  - building and running websites, booking systems and online shops
  - automation and data analysis
  - English (fluent)
  - Finnish (native)
  - driving licence B
  - customer service / sales experience
  - marketing (social media, SEO)
goal: side_income        # side_income | full_time | starttiraha
# The scope every new idea starts from (D-009); the New idea form can change it per idea.
business_mode: local     # online | local | hybrid
base_location:
  municipality: Rääkkylä
  municipality_code: KU707   # Statistics Finland municipality code (optional)
  region: North Karelia
  region_code: MK12          # Statistics Finland region (maakunta) code (optional)
  nearby: [Joensuu, Kitee]   # nearby towns, one per line
  official_domains: [raakkyla.fi, luotsipohjoiskarjala.fi]   # the base's official sites, one per line
  leader_group:              # optional Leader action group; leave both blank for none
    name: Jetina
    domain: jetina.fi
geography: [Rääkkylä, North Karelia, Finland, online/EU]   # target markets, nearest first
