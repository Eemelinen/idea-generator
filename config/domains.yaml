# Official-source allow-list. Regulatory, tax and grant claims must cite one of these or one of
# the run's own official domains: its base location's `official_domains` and Leader group domain
# (00_spec.json; the default is config/founder.yaml), which count as official for that run only
# (D-009). Place-specific domains belong there, not here.
# Matching is by registrable suffix: "vero.fi" also matches "www.vero.fi".
# Entries with a path (ec.europa.eu/eurostat) match only URLs under that path.
official:
  - vero.fi
  - prh.fi
  - ytj.fi
  - avoindata.prh.fi
  - suomi.fi
  - tyomarkkinatori.fi
  - finlex.fi
  - elinvoimakeskus.fi
  - finnvera.fi
  - businessfinland.fi
  - maaseutu.fi
  - stat.fi
  - pxdata.stat.fi
  - luke.fi
  - statdb.luke.fi
  - ec.europa.eu/eurostat

# Preferred (not required) domains per dimension, on top of the official list.
# Research agents try these first; scoring only requires the official list where the
# rubric's evidence_rule says has_official_source.
preferred:
  customer: []
  market: [stat.fi, luke.fi, ec.europa.eu/eurostat, visitfinland.fi, businessfinland.fi]
  competition: [ytj.fi, avoindata.prh.fi, finder.fi, asiakastieto.fi]
  pricing: []
  unit_economics: [stat.fi, vero.fi]
  gtm: []
  regulation: [vero.fi, prh.fi, suomi.fi, finlex.fi, ruokavirasto.fi, tukes.fi]
  financing: [tyomarkkinatori.fi, elinvoimakeskus.fi, finnvera.fi, businessfinland.fi, maaseutu.fi]
  location: [stat.fi]
  founder_risk: []
  killcause: [ytj.fi, avoindata.prh.fi]
