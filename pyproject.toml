[project]
name = "ideaforge"
version = "0.1.0"
description = "Local business-idea validator: Claude Code agents for research and debate, Python + SQLite for everything deterministic."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.32",
    "rapidfuzz>=3.9",
    "trafilatura>=1.12",
    "pandas>=2.2",
    "jinja2>=3.1",
    "truststore>=0.9",
    "lxml>=5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ideaforge"]

[tool.uv]
system-certs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
